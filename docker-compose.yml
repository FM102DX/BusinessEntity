name: businessentity-stack

# Root compose that bundles BusinessEntity app, its Postgres DB, Web Logger,
# and includes the Authentic (goauthentik) stack from Authentic/docker-compose.yml
# Requires Docker Compose V2 with `include` support.

include:
  - ./Authentic/docker-compose.yml

services:
  postgres-production-db:
    container_name: postgres-production-db
    build:
      context: ./postgres_db
      dockerfile: Dockerfile
    ports:
      - "5470:5432"
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: adm01
      POSTGRES_PASSWORD: adm01pwd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adm01 -d main"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - common

  business-entity:
    container_name: business-entity-container
    build:
      context: .
      dockerfile: ./BusinessEntity/Dockerfile
    ports:
      - "7000:80"
    environment:
      ASPNETCORE_URLS: http://*:80
      ASPNETCORE_ENVIRONMENT: Development
      IS_DOCKER: "true"
      # Authentik bootstrap settings
      # Inside container, use host.docker.internal:9000 to reach the Authentik port published on the host
      AUTHENTIK_BASE_URL: http://host.docker.internal:9000
      # What browsers should use to reach Authentik
      AUTHENTIK_BASE_URL_FOR_BROWSER: http://localhost:9000
      # API token must match AUTHENTIK_BOOTSTRAP_TOKEN from Authentic/docker-compose.yml
      AUTHENTIK_API_TOKEN: 5f81e1c4b8c0417c9f7b01a6d83a44dbdf18a27c29b93c4c9b71a9e2e06d1d3c
      # Redirect URIs for our app (signin-oidc will be auto-added per host)
      AUTHENTIK_REDIRECT_URIS: http://localhost:7000/auth/callback
    depends_on:
      postgres-production-db:
        condition: service_healthy
    networks:
      - common

  web_logger:
    container_name: web_logger-container
    build:
      context: .
      dockerfile: ./BlazorServerWebLogger/Dockerfile
    ports:
      - "5080:80"
    environment:
      ASPNETCORE_URLS: http://*:80
      ASPNETCORE_ENVIRONMENT: Development
      IS_DOCKER: "true"
    depends_on:
      postgres-production-db:
        condition: service_healthy
    networks:
      - common

# External shared network used across scripts and containers
networks:
  common:
    external: true
    name: docker-business-entity-common-bridge

# Local data volume for the production Postgres
volumes:
  pgdata:
    driver: local
