# Authentik stack (included from root compose via `include:`)
# Docker Compose v2

services:
  authentic_postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "authentik"
      POSTGRES_USER: "authentik"
      POSTGRES_PASSWORD: "HNIm7YwTKMK0rFED3cE73A"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - common

  authentic_redis:
    image: docker.io/library/redis:alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis:/data
    networks:
      - common

  authentic_server:
    image: ghcr.io/goauthentik/server:2025.6.0
    command: server
    restart: unless-stopped
    environment:
      # ── core ────────────────────────────────────────────────────────────────
      AUTHENTIK_SECRET_KEY: "HvitN4vO2BIqovviFmX+1HRPkqGY/1NNJfFbjSLc5nI="
      AUTHENTIK_REDIS__HOST: authentic_redis
      AUTHENTIK_POSTGRESQL__HOST: authentic_postgresql
      AUTHENTIK_POSTGRESQL__USER: "authentik"
      AUTHENTIK_POSTGRESQL__NAME: "authentik"
      AUTHENTIK_POSTGRESQL__PASSWORD: "HNIm7YwTKMK0rFED3cE73A"

      # ── bootstrap admin & API token ────────────────────────────────────────
      AUTHENTIK_BOOTSTRAP_EMAIL: "be-adm@business-entity.local"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "SuperStrong!123"
      AUTHENTIK_BOOTSTRAP_TOKEN: "5f81e1c4b8c0417c9f7b01a6d83a44dbdf18a27c29b93c4c9b71a9e2e06d1d3c"
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
      # - ./blueprints:/blueprints:ro  # если вернёшься к блюпринтам
    ports:
      - "9000:9000"   # HTTP
      - "9443:9443"   # HTTPS
    depends_on:
      authentic_postgresql:
        condition: service_healthy
      authentic_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - common

  authentic_worker:
    image: ghcr.io/goauthentik/server:2025.6.0
    command: worker
    restart: unless-stopped
    environment:
      AUTHENTIK_SECRET_KEY: "HvitN4vO2BIqovviFmX+1HRPkqGY/1NNJfFbjSLc5nI="
      AUTHENTIK_REDIS__HOST: authentic_redis
      AUTHENTIK_POSTGRESQL__HOST: authentic_postgresql
      AUTHENTIK_POSTGRESQL__USER: "authentik"
      AUTHENTIK_POSTGRESQL__NAME: "authentik"
      AUTHENTIK_POSTGRESQL__PASSWORD: "HNIm7YwTKMK0rFED3cE73A"

      # ── тот же bootstrap, что у server ─────────────────────────────────────
      AUTHENTIK_BOOTSTRAP_EMAIL: "be-adm@business-entity.local"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "SuperStrong!123"
      AUTHENTIK_BOOTSTRAP_TOKEN: "5f81e1c4b8c0417c9f7b01a6d83a44dbdf18a27c29b93c4c9b71a9e2e06d1d3c"
    # user: root  # раскомментируй, если нужен доступ к /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./media:/media
      - ./certs:/certs
      - ./custom-templates:/templates
      # - ./blueprints:/blueprints:ro
    depends_on:
      authentic_postgresql:
        condition: service_healthy
      authentic_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - common
volumes:
  database:
    driver: local
  redis:
    driver: local
